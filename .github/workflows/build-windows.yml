name: Windows x64 Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17.0.20+101' # Temurin 17.0.20.1+1 in Adoptium SemVer notation
      - name: Install locked dependencies
        run: npm ci
      - name: Cache pinned Windows build tools
        uses: actions/cache@v4
        with:
          path: third_party/build-tools/cache
          key: build-tools-${{ runner.os }}-${{ hashFiles('third_party/build-tools/SOURCE.json') }}
      - name: Validate pinned Windows build tools
        run: npm run prepare:builder-tools
      - name: Verify TypeScript and tests
        run: npm run verify
      - name: Configure PlayerHost x64
        run: cmake -S native/player-host -B native/player-host/build -A x64
      - name: Build PlayerHost x64
        run: cmake --build native/player-host/build --config Release
      - name: Prepare pinned LGPL libmpv runtime
        uses: actions/cache@v4
        with:
          path: third_party/mpv/cache
          key: mpv-win64-${{ hashFiles('third_party/mpv/win-x64/SOURCE.txt') }}
      - name: Validate pinned LGPL libmpv runtime
        run: npm run prepare:mpv
      - name: Test PlayerHost Named Pipe
        shell: pwsh
        run: ./scripts/test-player-host.ps1
      - name: Verify PlayerHost pipe bounds and access controls
        shell: pwsh
        run: ./scripts/test-player-host-pipe-hardening.ps1
      - name: Validate controlled video seek and clock
        shell: pwsh
        run: ./scripts/test-player-host-video.ps1
      - name: Stress PlayerHost 100 media switches
        shell: pwsh
        run: ./scripts/test-player-host-switch-stress.ps1
      - name: Audit runtime and build dependencies
        run: npm audit --audit-level=high
      - name: Package Windows x64
        run: npm run package:win
      - name: Record actual packaged runtimes
        shell: pwsh
        run: ./scripts/runtime-inventory.ps1 -ReleaseDir dist/releases -EvidencePath dist/releases/runtime-inventory.json
      - name: Smoke test packaged Electron renderer
        run: npm run smoke:packaged
      - name: Test packaged lifecycle and recovery
        shell: pwsh
        run: ./scripts/test-windows-lifecycle.ps1
      - name: Smoke test packaged UI at 100% DPI
        shell: pwsh
        run: |
          $env:FND_DPI_SCALE = '1'
          $env:FND_CAPTURE_IMAGES = '1'
          ./scripts/test-packaged-ui.ps1
      - name: Smoke test packaged UI at 125% DPI
        shell: pwsh
        run: |
          $env:FND_DPI_SCALE = '1.25'
          $env:FND_CAPTURE_IMAGES = '0'
          ./scripts/test-packaged-ui.ps1
      - name: Smoke test packaged UI at 150% DPI and high contrast
        shell: pwsh
        run: |
          $env:FND_DPI_SCALE = '1.5'
          $env:FND_HIGH_CONTRAST = '1'
          $env:FND_CAPTURE_IMAGES = '0'
          ./scripts/test-packaged-ui.ps1
      - name: Smoke test packaged UI at 200% DPI and high contrast
        shell: pwsh
        run: |
          $env:FND_DPI_SCALE = '2'
          $env:FND_HIGH_CONTRAST = '1'
          $env:FND_CAPTURE_IMAGES = '0'
          ./scripts/test-packaged-ui.ps1
      - name: Resolve package version
        id: package_version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Validate packaged UI performance evidence
        if: always()
        shell: pwsh
        run: |
          $directory = Join-Path $PWD 'dist/ui-smoke'
          $prefixes = @('scale-1-normal', 'scale-1-25-normal', 'scale-1-5-high-contrast', 'scale-2-high-contrast')
          foreach ($prefix in $prefixes) {
            $reportPath = Join-Path $directory ($prefix + '-surface-evidence.json')
            $timingPath = Join-Path $directory ($prefix + '-surface-timing.jsonl')
            $performancePath = Join-Path $directory ($prefix + '-performance.json')
            foreach ($file in @($reportPath, $timingPath, $performancePath)) {
              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing UI smoke evidence: $file" }
            }
            $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
            if ($report.status -ne 'complete' -or $report.flushAcknowledged -ne $true -or $report.accepted -le 0 -or @($report.missingMetrics).Count -ne 0 -or $report.rejected -ne 0) {
              throw "Incomplete surface timing evidence: $prefix"
            }
            $performance = Get-Content -LiteralPath $performancePath -Raw | ConvertFrom-Json
            if ($performance.schemaVersion -ne 1 -or $performance.workload -ne 'packaged-ui-smoke-v1' -or $performance.durationMs -le 0) {
              throw "Invalid performance telemetry envelope: $prefix"
            }
            if ($performance.counters.playbackStatsIpcCalls -le 0 -or $performance.uiMetrics.navigationMs.count -lt 8 -or $performance.uiMetrics.rendererFrameP95Ms.count -lt 1) {
              throw "Performance telemetry is missing required workload samples: $prefix"
            }
          }
          $routes = @('home', 'vod', 'live', 'music', 'player', 'search', 'favorites', 'history', 'sources', 'settings')
          foreach ($route in $routes) {
            $image = Join-Path $directory ('scale-1-normal-' + $route + '.jpg')
            if (-not (Test-Path -LiteralPath $image -PathType Leaf)) { throw "Missing 100% DPI screenshot: $image" }
          }
          Write-Host 'All four DPI surface reports, performance telemetry files, and ten 100% DPI screenshots are complete.'
      - name: Upload 100% DPI UI evidence
        id: upload_ui_100
        continue-on-error: true
        if: always() && hashFiles('dist/ui-smoke/*.jpg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: v${{ steps.package_version.outputs.version }}-ui-smoke-100dpi
          path: dist/ui-smoke/*.jpg
          if-no-files-found: error
          retention-days: 1
      - name: Upload all DPI surface timing evidence
        continue-on-error: true
        id: upload_surface_timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-performance-evidence
          path: |
            dist/ui-smoke/*-surface-timing.jsonl
            dist/ui-smoke/*-surface-evidence.json
            dist/ui-smoke/*-performance.json
          if-no-files-found: error
          retention-days: 1
      - name: Resolve verified Windows release assets
        id: release_assets
        shell: pwsh
        run: |
          npm run release:manifest
          if ($LASTEXITCODE -ne 0) { throw 'Final release manifest validation failed.' }
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $manifest = Get-Content -LiteralPath dist/releases/release-manifest.json -Raw | ConvertFrom-Json
          $expectedNames = @("Free-New-Desk-Setup-$version-x64.exe", "Free-New-Desk-Portable-$version-x64.exe")
          $assets = @($manifest.assets)
          if ($manifest.version -ne $version -or $assets.Count -ne 2 -or @($assets.name | Select-Object -Unique).Count -ne 2) {
            throw 'Release manifest must list exactly two unique artifacts for the current version.'
          }
          $paths = foreach ($asset in $assets) {
            if ($asset.name -cnotin $expectedNames) { throw "Unexpected release asset: $($asset.name)" }
            $file = Join-Path 'dist/releases' $asset.name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release asset: $file" }
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $asset.sha256) { throw "Release asset hash mismatch: $file" }
            $file.Replace('\', '/')
          }
          $paths += @('dist/releases/latest.yml', 'dist/releases/release-manifest.json', 'dist/releases/SHA256SUMS.txt', 'dist/releases/runtime-inventory.json')
          foreach ($file in $paths) { if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release file: $file" } }
          $delimiter = 'release_paths_' + [Guid]::NewGuid().ToString('N')
          @("paths<<$delimiter") + $paths + @($delimiter) | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - name: Preserve verified Windows build artifacts
        id: upload_release_artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ github.sha }}
          path: ${{ steps.release_assets.outputs.paths }}
          if-no-files-found: error
          retention-days: 7
      - name: Report Windows artifact delivery status
        if: always()
        shell: pwsh
        env:
          UI_UPLOAD_OUTCOME: ${{ steps.upload_ui_100.outcome }}
          SURFACE_UPLOAD_OUTCOME: ${{ steps.upload_surface_timing.outcome }}
          RELEASE_UPLOAD_OUTCOME: ${{ steps.upload_release_artifacts.outcome }}
        run: |
          $outcomes = @(
            @{ Name = '100% DPI screenshots'; Outcome = $env:UI_UPLOAD_OUTCOME },
            @{ Name = 'four-DPI timing/performance evidence'; Outcome = $env:SURFACE_UPLOAD_OUTCOME },
            @{ Name = 'verified Windows installer/portable outputs'; Outcome = $env:RELEASE_UPLOAD_OUTCOME }
          )
          $failed = @($outcomes | Where-Object { $_.Outcome -eq 'failure' })
          if ($failed.Count -gt 0) {
            $names = ($failed | ForEach-Object { $_.Name }) -join ', '
            $message = "Windows build, native tests, packaging, and UI smoke checks completed independently of artifact delivery. These uploads failed: $names. Check upload logs; GitHub Actions storage quota or a transient artifact service error can prevent storage. Evidence was validated before upload."
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $message -Encoding utf8
            Write-Warning $message
          } else {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Windows build, validation, and configured artifact uploads completed.' -Encoding utf8
          }

